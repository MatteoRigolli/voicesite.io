<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Assistente AI Copilot con conversazione vocale">
  <title>Assistente AI vocale</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js" defer></script>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="assistant" aria-labelledby="assistant-title">
      <header class="assistant__header">
        <div>
          <p class="eyebrow">Microsoft Copilot Studio</p>
          <h1 id="assistant-title">Assistente AI</h1>
        </div>
        <div class="status" role="status" aria-live="polite">
          <span id="status-dot" class="status__dot"></span>
          <span id="status-text">Connessione…</span>
        </div>
      </header>

      <div id="configuration-error" class="notice" role="alert" hidden>
        <strong>Configurazione incompleta.</strong>
        <span id="configuration-error-text"></span>
      </div>

      <div id="webchat" class="webchat" role="region" aria-label="Conversazione con l'assistente"></div>

      <footer class="voice-controls">
        <button id="microphone-button" class="voice-button" type="button" disabled
                aria-label="Inizia a parlare" aria-pressed="false">
          <span class="voice-button__icon" aria-hidden="true">🎙️</span>
          <span id="microphone-label">Parla</span>
        </button>
        <button id="stop-button" class="secondary-button" type="button" disabled>
          Interrompi voce
        </button>
        <label class="voice-toggle">
          <input id="voice-output-toggle" type="checkbox" checked>
          Leggi le risposte
        </label>
      </footer>

      <p id="voice-help" class="voice-help">
        Premi “Parla”, autorizza il microfono e formula una domanda in italiano.
      </p>
    </section>
  </main>

  <noscript>Per utilizzare l’assistente devi abilitare JavaScript.</noscript>
</body>
</html>
