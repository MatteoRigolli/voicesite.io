<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Agent Architect</title>

<script src="https://cdn.botframework.com/botframework-webchat/t.jsscript>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    font-family:"Segoe UI",sans-serif;
    background:#0f172a;
}

#webchat{
    width:100%;
    height:100vh;
}

#voiceButton{
    position:fixed;
    bottom:90px;
    right:20px;

    width:70px;
    height:70px;

    border:none;
    border-radius:50%;

    background:#38bdf8;
    color:#0f172a;

    font-size:30px;
    cursor:pointer;

    box-shadow:0 4px 12px rgba(0,0,0,.3);
}

#voiceButton.listening{
    background:#ef4444;
    color:white;
}

</style>

</head>

<body>

<div id="webchat"></div>

<button id="voiceButton">
🎤
</button>

<script>

const DIRECT_LINE_SECRET =
'4VpdOAvO5WmgsRXUFRAMQP43gHzuq77FuHZtdRvIPZclMr0YL4vKJQQJ99CIACi5YpzAArohAAABAZBS3ZDT.6WffpdmSZ3H9nWU3y7JGGpqe3G8ZpWErWRz7Y995cnarqIxrJex9JQQJ99CIACi5YpzAArohAAABAZBS30uf';

let latestActivityId = null;

const directLine = window.WebChat.createDirectLine({
    secret: DIRECT_LINE_SECRET
});

window.WebChat.renderWebChat(
{
    directLine,
    locale:'it-IT'
},
document.getElementById('webchat')
);

const recognition =
window.SpeechRecognition
? new SpeechRecognition()
: new webkitSpeechRecognition();

recognition.lang='it-IT';
recognition.interimResults=false;
recognition.continuous=false;

const button =
document.getElementById('voiceButton');

button.addEventListener('click',()=>{

    recognition.start();

    button.classList.add('listening');

});

recognition.onresult = e => {

    const text =
    e.results[0][0].transcript;

    directLine.postActivity({
        type:'message',
        from:{id:'user'},
        text:text
    }).subscribe();

};

recognition.onend = ()=>{

    button.classList.remove('listening');

};

directLine.activity$
.subscribe(activity=>{

    if(activity.type !== 'message') return;

    if(activity.from.id === 'user') return;

    if(activity.id === latestActivityId) return;

    latestActivityId = activity.id;

    const reply =
    activity.text;

    if(reply){

        const utterance =
        new SpeechSynthesisUtterance(reply);

        utterance.lang='it-IT';

        window.speechSynthesis.speak(
            utterance
        );
    }

});

</script>

</body>
</html>
